# Каталог сервисов для веб-интерфейса. Перенесён из vm/webui/vpn-ui.py
# (CATALOG) — хранится в коробке, а не читается из сети: страница должна
# открываться и когда GitHub недоступен.
#
# key      — «источник:набор» из catalogs/sources.yaml
# default  — политика пресета онбординга (own | fast | off): нетехнарь не
#            должен настраивать каталог, чтобы «просто заработало». Пресет
#            снят с боевой домашней конфигурации (sync/rulesets.list).
groups:
  - name: Базовое для РФ
    items:
      - key: vernette:unavailable-in-russia
        title: Недоступное из России
        desc: >-
          Всё, что недоступно из России — сервисы, которые сами блокируют
          российские адреса. Закрывает «а почему этот сайт не открылся»
          и нужен для облаков IoT (Bosch, Ubiquiti). ~730 доменов.
        default: fast
      - key: vernette:rkn
        title: Реестр РКН
        desc: >-
          Реестр заблокированного в РФ. Огромный и с мусором — мошеннические
          сайты, спам. Для дома скорее вреден.
        default: "off"
