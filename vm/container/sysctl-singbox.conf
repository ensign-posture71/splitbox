# Контейнер работает шлюзом для abroad-трафика (Вариант A, D1),
# поэтому обязан пересылать чужие пакеты.
net.ipv4.ip_forward = 1

# IPv6 наружу не маршрутизируется, а RA в LAN раздаёт кто-то помимо роутера (O23).
# Пересылку IPv6 не включаем сознательно: иначе часть abroad-трафика уйдёт
# по IPv6 мимо всей классификации.
net.ipv6.conf.all.forwarding = 0
