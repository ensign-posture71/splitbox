# Drop-in для sing-box.service -> /etc/systemd/system/sing-box.service.d/
#
# Без обвязки TPROXY (nft-правило + ip rule + таблица 100) sing-box слушает,
# но транзитные пакеты до него не доходят: роутер шлёт их на контейнер,
# контейнер возвращает их роутеру по default-маршруту, и они кружат
# до исчерпания TTL.
#
# Requires + After гарантируют, что обвязка поднимется ДО sing-box
# и при любом его старте — в том числе после ручной остановки.

[Unit]
Requires=singbox-tproxy.service
After=singbox-tproxy.service
