[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splitbox"
version = "0.1.0"
description = "Коробочный VPN-шлюз: sing-box + WireGuard + AdGuard + веб-интерфейс"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "cryptography>=41",
    "bcrypt>=4.0",          # формат пароля AdGuard — только bcrypt
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "segno>=1.6",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
]
# httpx2 — транспорт starlette.TestClient; без него тесты API падают
# на импорте в свежем окружении.
dev = ["pytest>=8", "httpx2>=0.29"]

[tool.setuptools.packages.find]
include = ["splitbox*"]

[tool.setuptools.package-data]
splitbox = ["template.json", "api/templates/*.html", "api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
