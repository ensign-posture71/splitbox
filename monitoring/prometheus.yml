# Мониторинг домашнего VPN-шлюза (D25). Схема: docs/HANDOFF.md
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"], labels: {host: monitoring}}]

  - job_name: node
    static_configs:
      - {targets: ["localhost:9100"], labels: {host: monitoring}}
      - {targets: ["192.168.88.6:9100"], labels: {host: singbox-gw}}
      - {targets: ["192.168.88.100:9100"], labels: {host: hp}}

  - job_name: mikrotik
    scrape_interval: 30s
    static_configs: [{targets: ["localhost:49090"]}]

  - job_name: adguard
    static_configs: [{targets: ["localhost:9617"]}]

  - job_name: singbox
    scrape_interval: 10s
    static_configs: [{targets: ["192.168.88.6:9550"], labels: {host: singbox-gw}}]

  - job_name: proxmox
    metrics_path: /pve
    params: {target: ["192.168.88.100"]}
    static_configs: [{targets: ["192.168.88.61:9221"]}]
