# Splitbox — базовый стек (режим vps: вход только через WireGuard).
# Режим домашнего шлюза: docker compose -f compose.yaml -f compose.lan.yaml up -d
#
# Архитектура — один владелец сетевого пространства (gateway) и sidecar'ы
# через network_mode: service:gateway. Это реплика LXC-донора: общий
# 127.0.0.1, health-проба и clash_api не видны снаружи, порты публикуются
# один раз на gateway.
name: splitbox

# Предел на журналы контейнеров. Без него json-file растёт без конца:
# sing-box на уровне info пишет по три строки на соединение, а через шлюз
# идёт весь трафик сети. Замер на нагруженном шлюзе — 13 ГБ за десять
# часов; постоянная запись держала гипервизор в ожидании диска (O45).
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  init:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    image: splitbox-app
    logging: *logging
    command: ["python", "-m", "splitbox.bootstrap"]
    environment:
      MODE: ${MODE:-vps}
    volumes:
      - state:/var/lib/splitbox
    restart: "no"

  gateway:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    image: splitbox-gateway
    logging: *logging
    environment:
      MODE: ${MODE:-vps}
    ports:
      - "${WG_PORT:-51820}:51820/udp"
      # Вебка: после онбординга в режиме vps закройте порт фаерволом
      # и ходите через WireGuard (http://10.99.0.1:8443).
      - "${WEB_PORT:-8443}:8443"
    volumes:
      - state:/var/lib/splitbox
      - singbox-cache:/var/lib/sing-box
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  adguard:
    image: adguard/adguardhome:v0.107.52
    logging: *logging
    network_mode: service:gateway
    volumes:
      - state:/var/lib/splitbox
      - adguard-work:/opt/adguardhome/work
    command: ["--config", "/var/lib/splitbox/adguard/conf/AdGuardHome.yaml",
              "--work-dir", "/opt/adguardhome/work", "--no-check-update"]
    depends_on:
      init:
        condition: service_completed_successfully
      gateway:
        condition: service_started
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    image: splitbox-app
    logging: *logging
    network_mode: service:gateway
    environment:
      # Одноразовый токен первичной настройки (генерирует install.sh):
      # пока пароль не установлен, мастер открывается только по ссылке
      # с этим токеном. Пусто = токен не требуется (домашняя установка).
      SPLITBOX_SETUP_TOKEN: ${SETUP_TOKEN:-}
      # Адрес и bearer-токен локального агента qBittorrent из .env.
      QBITTORRENT_STATS_URL: ${QBITTORRENT_STATS_URL:-}
      QBITTORRENT_STATS_TOKEN: ${QBITTORRENT_STATS_TOKEN:-}
      # Ссылка на UI qBittorrent (опционально).
      QBITTORRENT_WEB_UI_URL: ${QBITTORRENT_WEB_UI_URL:-}
    volumes:
      - state:/var/lib/splitbox
    depends_on:
      init:
        condition: service_completed_successfully
      gateway:
        condition: service_started
    restart: unless-stopped

volumes:
  state:
  singbox-cache:
  adguard-work:
